name: Glyphin Simulation 16 Semantic Scaling

on:
  workflow_dispatch:
  push:
    paths:
      - glyphin_simulation16.py
      - simulation16.trigger

jobs:
  simulation16-scaling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tokenizer
        run: python -m pip install --disable-pip-version-check tiktoken==0.11.0
      - name: Run Simulation 16
        run: python glyphin_simulation16.py --output glyphin_simulation16_result.json
      - name: Upload Simulation 16 result
        uses: actions/upload-artifact@v4
        with:
          name: glyphin-simulation16-semantic-result
          path: glyphin_simulation16_result.json
