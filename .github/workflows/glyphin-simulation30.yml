name: Glyphin Simulation 30 Query Anchor Retrieval

on:
  push:
    paths:
      - 'glyphin_simulation30.py'
      - 'simulation30.trigger'
      - 'glyphin_simulation21.py'
      - 'glyphin_simulation17.py'
      - 'glyphin_simulation18.py'
      - 'glyphin_simulation20.py'
      - 'glyphin_state_referee.py'
      - 'glyphin_research_core.py'
      - '.github/workflows/glyphin-simulation30.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'tiktoken==0.11.0'
      - run: python glyphin_simulation30.py --output glyphin_simulation30_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: glyphin-simulation30-result
          path: glyphin_simulation30_result.json
