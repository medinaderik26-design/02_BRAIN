name: Glyphin Simulation 17 Token Optimized Semantic Encoding

on:
  workflow_dispatch:
  push:
    paths:
      - glyphin_simulation17.py
      - simulation17.trigger

jobs:
  simulation17-token-optimization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tokenizer
        run: pip install tiktoken==0.11.0
      - name: Run Simulation 17
        run: python glyphin_simulation17.py --output glyphin_simulation17_result.json
      - name: Upload Simulation 17 result
        uses: actions/upload-artifact@v4
        with:
          name: glyphin-simulation17-token-result
          path: glyphin_simulation17_result.json
