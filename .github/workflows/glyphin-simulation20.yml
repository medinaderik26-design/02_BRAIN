name: Glyphin Simulation 20 State-Field Factorization

on:
  workflow_dispatch:
  push:
    paths:
      - 'glyphin_simulation20.py'
      - 'simulation20.trigger'
      - 'glyphin_simulation19.py'
      - 'glyphin_simulation18.py'
      - 'glyphin_simulation17.py'
      - 'glyphin_research_core.py'
      - 'glyphin_state_referee.py'
      - 'glyphin_compression.py'

jobs:
  simulation20-factorization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tokenizer
        run: pip install tiktoken==0.11.0
      - name: Run Simulation 20
        run: python glyphin_simulation20.py --output glyphin_simulation20_result.json
      - name: Upload Simulation 20 result
        uses: actions/upload-artifact@v4
        with:
          name: glyphin-simulation20-state-field-result
          path: glyphin_simulation20_result.json
