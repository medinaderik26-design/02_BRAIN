name: Astra Anchor Smoke Test

on:
  push:
    branches:
      - main
    paths:
      - "astra_anchor.py"
      - "test_astra_anchor.py"
      - "ASTRA_SYMBOLIC_ANCHOR_SPEC.md"
      - ".github/workflows/astra-anchor-smoke.yml"
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run Astra anchor smoke test
        run: python test_astra_anchor.py
